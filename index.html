<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GraphRAG — GO Term Community Explorer</title>
<style>
  :root {
    --bg: #0f1115; --surface: #171a21; --ink: #e7e9ee; --ink-muted: #8b93a1;
    --rule: #262b35; --accent: #5fb5a3; --bad: #d97757; --good: #5fb5a3;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); margin: 0;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    padding: 2.5rem 1.5rem 5rem;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 0.3rem; font-weight: 600; }
  .sub { color: var(--ink-muted); font-size: 0.85rem; margin: 0 0 1.8rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin-bottom: 1.8rem; }
  .stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 0.9rem 1rem; }
  .stat .n { font-size: 1.5rem; font-weight: 600; }
  .stat .l { color: var(--ink-muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 0.2rem; }
  .controls { display: flex; gap: 0.6rem; margin-bottom: 1.2rem; flex-wrap: wrap; align-items: center; }
  .controls input { background: var(--surface); border: 1px solid var(--rule); color: var(--ink); padding: 0.5rem 0.7rem; border-radius: 6px; font-family: inherit; font-size: 0.85rem; flex: 1; min-width: 160px; }
  .controls button { background: var(--surface); border: 1px solid var(--rule); color: var(--ink-muted); padding: 0.5rem 0.9rem; border-radius: 6px; font-family: inherit; font-size: 0.8rem; cursor: pointer; }
  .controls button.active { color: var(--ink); border-color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--rule); border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 0.7rem; }
  .card.coherent { border-left-color: var(--good); }
  .card.incoherent { border-left-color: var(--bad); }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 0.4rem; }
  .theme { font-size: 0.92rem; color: var(--ink); font-weight: 500; }
  .score { font-size: 0.78rem; color: var(--ink-muted); white-space: nowrap; }
  .score b { color: var(--ink); }
  .reasoning { font-size: 0.8rem; color: var(--ink-muted); margin: 0.3rem 0 0.5rem; }
  .terms { font-size: 0.72rem; color: var(--ink-muted); }
  .terms .outlier { color: var(--bad); text-decoration: line-through; }
  #empty { color: var(--ink-muted); text-align: center; padding: 2rem; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GraphRAG — GO Term Community Explorer</h1>
  <p class="sub">LLM-judge coherence scores for Leiden-detected communities of Gene Ontology terms, before/after outlier cleaning. Loaded live from <code>llm_judge_se2_results_level2.json</code>.</p>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <input id="search" type="text" placeholder="search theme or GO term…" />
    <button data-filter="all" class="active">All</button>
    <button data-filter="coherent">Coherent</button>
    <button data-filter="incoherent">Not coherent</button>
    <button data-filter="improved">Score improved</button>
  </div>

  <div id="list"></div>
  <p id="empty">No communities match that filter.</p>
</div>

<script>
async function main() {
  const res = await fetch('llm_judge_se2_results_level2.json');
  const data = await res.json();

  const n = data.length;
  const coherent = data.filter(d => d.coherent).length;
  const improved = data.filter(d => d.score_improved).length;
  const avgInitial = (data.reduce((s, d) => s + d.initial_score, 0) / n).toFixed(2);
  const avgFinal = (data.reduce((s, d) => s + d.final_score, 0) / n).toFixed(2);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${n}</div><div class="l">Communities judged</div></div>
    <div class="stat"><div class="n">${(coherent / n * 100).toFixed(1)}%</div><div class="l">Scored coherent</div></div>
    <div class="stat"><div class="n">${avgInitial} → ${avgFinal}</div><div class="l">Avg score, before → after cleaning</div></div>
    <div class="stat"><div class="n">${improved}</div><div class="l">Improved by outlier removal</div></div>
  `;

  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const search = document.getElementById('search');
  const buttons = [...document.querySelectorAll('.controls button')];
  let filter = 'all';

  function render() {
    const q = search.value.trim().toLowerCase();
    const rows = data.filter(d => {
      if (filter === 'coherent' && !d.coherent) return false;
      if (filter === 'incoherent' && d.coherent) return false;
      if (filter === 'improved' && !d.score_improved) return false;
      if (!q) return true;
      return d.theme.toLowerCase().includes(q) ||
             d.original_terms.some(t => t.toLowerCase().includes(q));
    }).sort((a, b) => b.final_score - a.final_score);

    empty.style.display = rows.length ? 'none' : 'block';

    list.innerHTML = rows.map(d => `
      <div class="card ${d.coherent ? 'coherent' : 'incoherent'}">
        <div class="card-head">
          <span class="theme">${escapeHtml(d.theme)}</span>
          <span class="score">community ${escapeHtml(d.community_id)} · <b>${d.initial_score} → ${d.final_score}</b> · lin ${d.lin_score}</span>
        </div>
        <p class="reasoning">${escapeHtml(d.reasoning)}</p>
        <div class="terms">${d.original_terms.map(t =>
          `<span class="${d.outliers.includes(t) ? 'outlier' : ''}">${t}</span>`
        ).join(', ')}</div>
      </div>
    `).join('');
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  search.addEventListener('input', render);
  buttons.forEach(b => b.addEventListener('click', () => {
    buttons.forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.filter;
    render();
  }));

  render();
}

main().catch(err => {
  document.getElementById('list').innerHTML =
    `<p style="color:var(--ink-muted)">Couldn't load results — serve this file over HTTP (e.g. <code>python3 -m http.server</code>) rather than opening it directly, since the fetch is blocked on file:// URLs.</p>`;
  console.error(err);
});
</script>
</body>
</html>
